<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- Executive Gradient: Deep Royal Blue to Electric Cyan -->
    <linearGradient id="barGrad1" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="barGrad2" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#1D4ED8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="barGrad3" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0369A1"/>
      <stop offset="100%" stop-color="#0EA5E9"/>
    </linearGradient>
    <linearGradient id="arrowGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1D4ED8"/>
      <stop offset="50%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    
    <!-- Subtle Executive Shadow -->
    <filter id="softShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Clean Container Squircle (Soft Executive Badge) -->
  <rect x="8" y="8" width="104" height="104" rx="26" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.8" filter="url(#softShadow)"/>

  <!-- Analytics Ascending Bars -->
  <!-- Bar 1 (Descriptive Baseline) -->
  <rect x="28" y="66" width="14" height="26" rx="4" fill="url(#barGrad1)"/>
  
  <!-- Bar 2 (Predictive Trajectory) -->
  <rect x="48" y="52" width="14" height="40" rx="4" fill="url(#barGrad2)"/>
  
  <!-- Bar 3 (Prescriptive Apex) -->
  <rect x="68" y="38" width="14" height="54" rx="4" fill="url(#barGrad3)"/>

  <!-- Dynamic Predictive Growth Curve -->
  <path d="M 22 66 C 24 58, 42 56, 56 46 C 68 37, 78 28, 88 22" 
        fill="none" 
        stroke="url(#arrowGrad)" 
        stroke-width="6.5" 
        stroke-linecap="round"/>

  <!-- Sharp Modern Arrow Head -->
  <polygon points="98,16 78,20 86,28 78,36" 
           fill="url(#arrowGrad)"/>
           
  <!-- Accent Point (AI Intelligence Node) -->
  <circle cx="88" cy="22" r="3" fill="#FFFFFF" stroke="#0284C7" stroke-width="2"/>
</svg>
